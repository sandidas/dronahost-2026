name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WP_MOCK_PORT: "3900"
  WORDPRESS_API_URL: http://localhost:3900/wp-json/wp/v2

jobs:
  static:
    name: Types, lint, contrast, content engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:contrast
      - name: check-content on every page spec and draft (also runs the app's page-spec check), and the comparison data
        # check:pages and lint:content are aliases of the same command. The app's Zod and layout checks run inside it as the host adapter.
        run: npm run check:content && npm run check:vs
      - name: Content engine tests (against the sample project) and this project's own tests
        run: npm run test:tools && npm run test:project
      - name: Content engine checks (a failure blocks the merge)
        # config, no-brand, links, schemas, register + governor cap, check-content on the changed files, posts, evaluation set.
        # Posts are checked only when the repository variable CONTENT_POSTS_API_URL is set (and, for drafts, the two secrets).
        run: npm run content:ci -- --base ${{ github.event.pull_request.base.sha || github.event.before }}
        env:
          WORDPRESS_API_URL: ${{ vars.CONTENT_POSTS_API_URL }}
          WORDPRESS_USER: ${{ secrets.WORDPRESS_USER }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}

  reuse:
    # The reuse proof: copy only the reusable engine into a temporary project, install it, set it up, run every check, and
    # prove nothing from this project is in the copy. On Windows the checkout has CRLF line endings, as a real Windows user's has.
    name: Reuse proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run test:reuse

  e2e:
    name: Build, Playwright, axe, links, JSON-LD
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start WordPress mock
        run: node tests/mocks/wp-server.mjs &
      - run: npm run build
      - run: npm run test:e2e
      - name: Accessibility, links, structured data, entities
        run: |
          npx next start -p 3200 &
          npx wait-on http://localhost:3200
          npm run qa:axe && npm run qa:links && npm run qa:jsonld && npm run qa:entities
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Start WordPress mock
        run: node tests/mocks/wp-server.mjs &
      - run: npm run build
      - run: npx @lhci/cli@0.14.x autorun
