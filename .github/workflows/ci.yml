name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WP_MOCK_PORT: "3900"
  WORDPRESS_API_URL: http://localhost:3900/wp-json/wp/v2

jobs:
  static:
    name: Types, lint, contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:contrast
      - name: Page specs and content lint
        run: npm run check:pages && npm run lint:content

  e2e:
    name: Build, Playwright, axe, links, JSON-LD
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start WordPress mock
        run: node tests/mocks/wp-server.mjs &
      - run: npm run build
      - run: npm run test:e2e
      - name: Accessibility, links, structured data, entities
        run: |
          npx next start -p 3200 &
          npx wait-on http://localhost:3200
          npm run qa:axe && npm run qa:links && npm run qa:jsonld && npm run qa:entities
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Start WordPress mock
        run: node tests/mocks/wp-server.mjs &
      - run: npm run build
      - run: npx @lhci/cli@0.14.x autorun
